name: Android BUILD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment'
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build_android_artifact:
    name: Build signed Android artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    steps:
      # -----------------------------------------------------------------------
      # CP-3 — Canonical environment/source resolution
      # -----------------------------------------------------------------------

      - name: Validate requested environment and canonical profile
        id: validate_profile
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}

          VAR_SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH }}
          VAR_ANDROID_FLAVOR: ${{ vars.ANDROID_FLAVOR }}
          VAR_OKANE_ENV: ${{ vars.OKANE_ENV }}
          VAR_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
          VAR_ARTIFACT_TYPE: ${{ vars.ANDROID_ARTIFACT_TYPE }}
        run: |
          set -euo pipefail

          emit() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          fail() {
            local state="$1"
            local message="$2"

            emit "status" "invalid"
            emit "state" "$state"

            echo "::error title=${state}::${message}"
            exit 1
          }

          environment="$ENVIRONMENT"
          ref_name="$REF_NAME"
          ref_type="$REF_TYPE"

          source_branch="$VAR_SOURCE_BRANCH"
          android_flavor="$VAR_ANDROID_FLAVOR"
          okane_env="$VAR_OKANE_ENV"
          application_id="$VAR_APPLICATION_ID"
          artifact_type="$VAR_ARTIFACT_TYPE"

          emit "environment" "$environment"
          emit "ref_name" "$ref_name"
          emit "ref_type" "$ref_type"

          case "$environment" in
            dev)
              expected_source_branch='develop'
              expected_android_flavor='dev'
              expected_okane_env='dev'
              expected_application_id='co.com.okane.okane.dev'
              expected_artifact_type='apk'
              ;;

            qa)
              expected_source_branch='develop'
              expected_android_flavor='qa'
              expected_okane_env='qa'
              expected_application_id='co.com.okane.okane.qa'
              expected_artifact_type='apk'
              ;;

            prod)
              expected_source_branch='master'
              expected_android_flavor='prod'
              expected_okane_env='prod'
              expected_application_id='co.com.okane.okane'
              expected_artifact_type='aab'
              ;;

            *)
              fail \
                "ANDROID_PROFILE_INVALID" \
                "Environment '${environment}' is not allowed."
              ;;
          esac

          emit "expected_source_branch" "$expected_source_branch"

          if [[ "$ref_type" != "branch" ]]; then
            fail \
              "ANDROID_SOURCE_REF_INVALID" \
              "github.ref_type must be 'branch', received '${ref_type}'."
          fi

          if [[ "$ref_name" != "$expected_source_branch" ]]; then
            fail \
              "ANDROID_SOURCE_REF_INVALID" \
              "github.ref_name '${ref_name}' does not match required source branch '${expected_source_branch}'."
          fi

          if [[ -z "$source_branch" ||
                -z "$android_flavor" ||
                -z "$okane_env" ||
                -z "$application_id" ||
                -z "$artifact_type" ]]; then
            fail \
              "ANDROID_PROFILE_INVALID" \
              "One or more required GitHub Environment variables are missing."
          fi

          if [[ "$source_branch" != "$expected_source_branch" ||
                "$android_flavor" != "$expected_android_flavor" ||
                "$okane_env" != "$expected_okane_env" ||
                "$application_id" != "$expected_application_id" ||
                "$artifact_type" != "$expected_artifact_type" ]]; then
            fail \
              "ANDROID_PROFILE_INVALID" \
              "GitHub Environment variables do not match the canonical Android BUILD profile."
          fi

          emit "status" "valid"
          emit "state" "ANDROID_PROFILE_RESOLVED"

          emit "source_branch" "$source_branch"
          emit "android_flavor" "$android_flavor"
          emit "okane_env" "$okane_env"
          emit "application_id" "$application_id"
          emit "artifact_type" "$artifact_type"

      - name: Checkout exact authorized source SHA
        if: steps.validate_profile.outputs.status == 'valid'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable source SHA
        id: resolve_sha
        if: steps.validate_profile.outputs.status == 'valid'
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

          if [[ "$source_sha" != "$TRIGGER_SHA" ]]; then
            echo "state=ANDROID_SOURCE_SHA_MISMATCH" >> "$GITHUB_OUTPUT"

            echo \
              "::error title=ANDROID_SOURCE_SHA_MISMATCH::Checked out SHA '${source_sha}' does not match authorized dispatch SHA '${TRIGGER_SHA}'."

            exit 1
          fi

          echo "state=ANDROID_SOURCE_SHA_RESOLVED" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # BUILD source version
      # -----------------------------------------------------------------------

      - name: Resolve Flutter version
        id: version
        if: steps.resolve_sha.outputs.state == 'ANDROID_SOURCE_SHA_RESOLVED'
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          pubspec = pathlib.Path("pubspec.yaml")

          if not pubspec.is_file():
              print(
                  "::error title=ANDROID_VERSION_STATE_INVALID::"
                  "pubspec.yaml does not exist."
              )
              sys.exit(1)

          text = pubspec.read_text(encoding="utf-8")

          matches = re.findall(
              r"^version:\s*([^\s#]+)",
              text,
              re.MULTILINE,
          )

          if len(matches) != 1:
              print(
                  "::error title=ANDROID_VERSION_STATE_INVALID::"
                  "pubspec.yaml must contain exactly one root version declaration."
              )
              sys.exit(1)

          version = matches[0]

          match = re.fullmatch(
              r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\+(0|[1-9]\d*)",
              version,
          )

          if match is None:
              print(
                  "::error title=ANDROID_VERSION_STATE_INVALID::"
                  f"Version '{version}' must match X.Y.Z+N."
              )
              sys.exit(1)

          major, minor, patch, build = match.groups()
          semver = f"{major}.{minor}.{patch}"

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])

          with output.open("a", encoding="utf-8") as stream:
              stream.write("state=ANDROID_VERSION_RESOLVED\n")
              stream.write(f"flutter_version={version}\n")
              stream.write(f"semver={semver}\n")
              stream.write(f"build_number={build}\n")

          print(f"Flutter version: {version}")
          PY

      # -----------------------------------------------------------------------
      # Reproducible toolchain
      # -----------------------------------------------------------------------

      - name: Set up Java 17
        if: steps.version.outputs.state == 'ANDROID_VERSION_RESOLVED'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.0
        if: steps.version.outputs.state == 'ANDROID_VERSION_RESOLVED'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Resolve Flutter dependencies
        id: dependencies
        if: steps.version.outputs.state == 'ANDROID_VERSION_RESOLVED'
        shell: bash
        run: |
          set -euo pipefail

          if ! flutter pub get; then
            echo "state=ANDROID_DEPENDENCY_RESOLUTION_FAILED" >> "$GITHUB_OUTPUT"

            echo \
              "::error title=ANDROID_DEPENDENCY_RESOLUTION_FAILED::Flutter dependencies could not be resolved."

            exit 1
          fi

          echo "state=ANDROID_DEPENDENCIES_RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Verify dependency resolution did not mutate repository
        id: prebuild_repository
        if: steps.dependencies.outputs.state == 'ANDROID_DEPENDENCIES_RESOLVED'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "state=ANDROID_REPOSITORY_MUTATION_DETECTED" >> "$GITHUB_OUTPUT"

            echo "::error title=ANDROID_REPOSITORY_MUTATION_DETECTED::Dependency resolution modified repository state."
            git status --short
            exit 1
          fi

          echo "state=ANDROID_REPOSITORY_CLEAN" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # CP-4 + CP-5
      # Ephemeral signing reconstruction + signed artifact generation
      # -----------------------------------------------------------------------

      - name: Reconstruct signing identity and build signed artifact
        id: artifact
        if: steps.prebuild_repository.outputs.state == 'ANDROID_REPOSITORY_CLEAN'
        shell: bash
        env:
          ENVIRONMENT: ${{ steps.validate_profile.outputs.environment }}

          ANDROID_FLAVOR: ${{ steps.validate_profile.outputs.android_flavor }}
          OKANE_ENV: ${{ steps.validate_profile.outputs.okane_env }}
          EXPECTED_APPLICATION_ID: ${{ steps.validate_profile.outputs.application_id }}
          ARTIFACT_TYPE: ${{ steps.validate_profile.outputs.artifact_type }}

          EXPECTED_SEMVER: ${{ steps.version.outputs.semver }}
          EXPECTED_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}

          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

          CONFIGURED_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          CONFIGURED_CERT_SHA1: ${{ vars.ANDROID_SIGNING_CERT_SHA1 }}
          CONFIGURED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          emit() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          fail() {
            local state="$1"
            local message="$2"

            emit "state" "$state"

            echo "::error title=${state}::${message}"
            exit 1
          }

          normalize_fingerprint() {
            printf '%s' "$1" |
              tr '[:lower:]' '[:upper:]' |
              tr -d '[:space:]:-'
          }

          signing_dir="${RUNNER_TEMP}/okane-android-signing"
          keystore_path="${signing_dir}/signing-keystore.jks"
          certificate_path="${signing_dir}/certificate.pem"

          probe_dir="${signing_dir}/probe"
          unsigned_probe="${signing_dir}/unsigned-probe.jar"
          signed_probe="${signing_dir}/signed-probe.jar"

          key_properties_path="android/app/key.properties"

          cleanup_signing() {
            rm -f "$key_properties_path"
            rm -rf "$signing_dir"
          }

          # No signing material may survive this step, including failure paths.
          trap cleanup_signing EXIT

          umask 077
          mkdir -p "$signing_dir"

          # -------------------------------------------------------------------
          # Canonical signing identity
          # -------------------------------------------------------------------

          case "$ENVIRONMENT" in
            dev)
              canonical_alias='okane-dev'
              canonical_sha1='B9:12:6E:1F:BD:69:74:40:31:25:24:FA:C6:62:96:5A:38:08:94:EC'
              canonical_sha256='4B:C2:62:50:DA:A2:49:3D:41:1D:7F:2D:BD:21:25:18:90:EF:7B:55:94:FB:3C:6B:93:FA:77:D4:E6:C1:0B:A2'
              ;;

            qa)
              canonical_alias='okane-qa'
              canonical_sha1='08:C2:2B:9B:4E:1D:B3:F9:0B:67:E3:4E:1F:07:D4:09:2A:83:DF:77'
              canonical_sha256='4B:98:74:79:A8:60:2B:C2:D3:A5:1A:4A:F0:EE:3E:E0:35:FE:58:07:74:66:5C:3A:61:D6:26:CC:82:88:C1:E5'
              ;;

            prod)
              canonical_alias='okane-upload'
              canonical_sha1='22:F2:92:D7:18:CB:21:E2:C7:D8:A6:0E:61:54:53:A0:3A:24:85:DD'
              canonical_sha256='92:7C:55:81:6B:B5:9C:A6:E5:18:23:BA:16:99:02:C9:A9:63:BF:00:F5:4E:96:67:AE:14:64:B9:10:75:33:C8'
              ;;

            *)
              fail \
                "ANDROID_SIGNING_CONFIG_INVALID" \
                "No canonical signing identity exists for environment '${ENVIRONMENT}'."
              ;;
          esac

          # -------------------------------------------------------------------
          # Signing configuration / secret validation
          # -------------------------------------------------------------------

          if [[ -z "${CONFIGURED_KEY_ALIAS:-}" ||
                -z "${CONFIGURED_CERT_SHA1:-}" ||
                -z "${CONFIGURED_CERT_SHA256:-}" ]]; then
            fail \
              "ANDROID_SIGNING_CONFIG_INVALID" \
              "One or more required Android signing variables are missing."
          fi

          if [[ -z "${KEYSTORE_BASE64:-}" ||
                -z "${STORE_PASSWORD:-}" ||
                -z "${KEY_PASSWORD:-}" ]]; then
            fail \
              "ANDROID_SIGNING_SECRET_MISSING" \
              "One or more required Android signing secrets are missing."
          fi

          if [[ "$CONFIGURED_KEY_ALIAS" != "$canonical_alias" ]]; then
            fail \
              "ANDROID_SIGNING_IDENTITY_MISMATCH" \
              "Configured Android key alias does not match the canonical environment identity."
          fi

          if [[ \
            "$(normalize_fingerprint "$CONFIGURED_CERT_SHA1")" != \
            "$(normalize_fingerprint "$canonical_sha1")" \
          ]]; then
            fail \
              "ANDROID_SIGNING_IDENTITY_MISMATCH" \
              "Configured SHA-1 fingerprint does not match the canonical environment identity."
          fi

          if [[ \
            "$(normalize_fingerprint "$CONFIGURED_CERT_SHA256")" != \
            "$(normalize_fingerprint "$canonical_sha256")" \
          ]]; then
            fail \
              "ANDROID_SIGNING_IDENTITY_MISMATCH" \
              "Configured SHA-256 fingerprint does not match the canonical environment identity."
          fi

          # -------------------------------------------------------------------
          # Reconstruct keystore
          # -------------------------------------------------------------------

          if ! printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$keystore_path"; then
            fail \
              "ANDROID_KEYSTORE_INVALID" \
              "Android keystore Base64 payload could not be decoded."
          fi

          if [[ ! -s "$keystore_path" ]]; then
            fail \
              "ANDROID_KEYSTORE_INVALID" \
              "Decoded Android keystore is empty."
          fi

          if ! keytool \
            -list \
            -keystore "$keystore_path" \
            -storepass "$STORE_PASSWORD" \
            -alias "$canonical_alias" \
            >/dev/null 2>&1; then
            fail \
              "ANDROID_KEYSTORE_INVALID" \
              "Keystore cannot be opened with the configured store password and alias."
          fi

          if ! keytool \
            -exportcert \
            -rfc \
            -keystore "$keystore_path" \
            -storepass "$STORE_PASSWORD" \
            -alias "$canonical_alias" \
            > "$certificate_path" 2>/dev/null; then
            fail \
              "ANDROID_KEYSTORE_INVALID" \
              "Certificate could not be exported from the reconstructed keystore."
          fi

          actual_sha1="$(
            openssl x509 \
              -in "$certificate_path" \
              -noout \
              -fingerprint \
              -sha1 |
              sed 's/^[^=]*=//'
          )"

          actual_sha256="$(
            openssl x509 \
              -in "$certificate_path" \
              -noout \
              -fingerprint \
              -sha256 |
              sed 's/^[^=]*=//'
          )"

          if [[ \
            "$(normalize_fingerprint "$actual_sha1")" != \
            "$(normalize_fingerprint "$canonical_sha1")" \
          ]]; then
            fail \
              "ANDROID_SIGNING_IDENTITY_MISMATCH" \
              "Reconstructed keystore SHA-1 fingerprint does not match the canonical signing identity."
          fi

          if [[ \
            "$(normalize_fingerprint "$actual_sha256")" != \
            "$(normalize_fingerprint "$canonical_sha256")" \
          ]]; then
            fail \
              "ANDROID_SIGNING_IDENTITY_MISMATCH" \
              "Reconstructed keystore SHA-256 fingerprint does not match the canonical signing identity."
          fi

          # -------------------------------------------------------------------
          # Prove private-key usability
          # -------------------------------------------------------------------

          mkdir -p "$probe_dir"

          printf '%s\n' \
            'Okane Android signing private-key usability probe.' \
            > "${probe_dir}/payload.txt"

          jar \
            --create \
            --file "$unsigned_probe" \
            -C "$probe_dir" \
            payload.txt

          if ! jarsigner \
            -keystore "$keystore_path" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar "$signed_probe" \
            "$unsigned_probe" \
            "$canonical_alias" \
            >/dev/null 2>&1; then
            fail \
              "ANDROID_PRIVATE_KEY_UNUSABLE" \
              "The configured private key could not sign the temporary probe."
          fi

          if ! jarsigner \
            -verify \
            "$signed_probe" \
            >/dev/null 2>&1; then
            fail \
              "ANDROID_SIGNATURE_PROBE_FAILED" \
              "The temporary signature probe could not be verified."
          fi

          emit "signing_alias" "$canonical_alias"
          emit "signing_sha1" "$actual_sha1"
          emit "signing_sha256" "$actual_sha256"
          emit "certificate_match" "pass"
          emit "private_key_probe" "pass"

          # -------------------------------------------------------------------
          # Temporary Gradle signing configuration
          # -------------------------------------------------------------------

          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$canonical_alias"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$key_properties_path"

          chmod 600 "$key_properties_path"

          # -------------------------------------------------------------------
          # Environment-specific signed build
          # -------------------------------------------------------------------

          case "$ARTIFACT_TYPE" in
            apk)
              if ! flutter build apk \
                --release \
                --flavor "$ANDROID_FLAVOR" \
                --dart-define="OKANE_ENV=${OKANE_ENV}"; then
                fail \
                  "ANDROID_BUILD_FAILED" \
                  "Flutter failed to generate the signed APK."
              fi
              ;;

            aab)
              if ! flutter build appbundle \
                --release \
                --flavor "$ANDROID_FLAVOR" \
                --dart-define="OKANE_ENV=${OKANE_ENV}"; then
                fail \
                  "ANDROID_BUILD_FAILED" \
                  "Flutter failed to generate the signed Android App Bundle."
              fi
              ;;

            *)
              fail \
                "ANDROID_BUILD_CONFIG_FAILED" \
                "Unsupported artifact type '${ARTIFACT_TYPE}'."
              ;;
          esac

          # -------------------------------------------------------------------
          # Locate the exact artifact
          # -------------------------------------------------------------------

          artifacts=()

          case "$ARTIFACT_TYPE" in
            apk)
              expected_artifact="build/app/outputs/flutter-apk/app-${ANDROID_FLAVOR}-release.apk"

              if [[ -f "$expected_artifact" ]]; then
                artifacts+=("$expected_artifact")
              fi
              ;;

            aab)
              expected_artifact="build/app/outputs/bundle/${ANDROID_FLAVOR}Release/app-${ANDROID_FLAVOR}-release.aab"

              if [[ -f "$expected_artifact" ]]; then
                artifacts+=("$expected_artifact")
              fi
              ;;
          esac

          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            fail \
              "ANDROID_ARTIFACT_NOT_FOUND" \
              "Expected exactly one canonical ${ARTIFACT_TYPE^^} artifact."
          fi

          artifact_path="${artifacts[0]}"
          artifact_size="$(stat -c '%s' "$artifact_path")"

          # -------------------------------------------------------------------
          # Verify signed artifact
          # -------------------------------------------------------------------

          application_id_check="N/A"
          version_check="N/A"
          signature_check="N/A"
          signer_match="N/A"

          if [[ "$ARTIFACT_TYPE" == "apk" ]]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

            if [[ -z "$sdk_root" ]]; then
              fail \
                "ANDROID_BUILD_CONFIG_FAILED" \
                "Android SDK root is unavailable."
            fi

            apksigner_path="$(
              find "$sdk_root/build-tools" \
                -mindepth 2 \
                -maxdepth 2 \
                -type f \
                -name apksigner \
                -print |
                sort -V |
                tail -n 1
            )"

            aapt_path="$(
              find "$sdk_root/build-tools" \
                -mindepth 2 \
                -maxdepth 2 \
                -type f \
                -name aapt \
                -print |
                sort -V |
                tail -n 1
            )"

            if [[ -z "$apksigner_path" || -z "$aapt_path" ]]; then
              fail \
                "ANDROID_BUILD_CONFIG_FAILED" \
                "Android APK verification tools are unavailable."
            fi

            if ! apk_verify_output="$(
              "$apksigner_path" \
                verify \
                --verbose \
                --print-certs \
                "$artifact_path"
            )"; then
              fail \
                "ANDROID_ARTIFACT_SIGNATURE_INVALID" \
                "APK signature verification failed."
            fi

            printf '%s\n' "$apk_verify_output"

            artifact_cert_sha256="$(
              printf '%s\n' "$apk_verify_output" |
                sed -n \
                  's/^.*certificate SHA-256 digest:[[:space:]]*//p' |
                head -n 1
            )"
            if [[ -z "$artifact_cert_sha256" ]]; then
              fail \
                "ANDROID_ARTIFACT_SIGNER_UNRESOLVED" \
                "APK signature is valid but the signer certificate fingerprint could not be resolved."
            fi

            if [[ \
              "$(normalize_fingerprint "$artifact_cert_sha256")" != \
              "$(normalize_fingerprint "$canonical_sha256")" \
            ]]; then
              fail \
                "ANDROID_ARTIFACT_SIGNER_MISMATCH" \
                "APK signer does not match the canonical environment signing identity."
            fi

            signer_match="pass"
            signature_check="pass"

            badging="$("$aapt_path" dump badging "$artifact_path")"

            actual_application_id="$(
              printf '%s\n' "$badging" |
                sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
                head -n 1
            )"

            actual_version_code="$(
              printf '%s\n' "$badging" |
                sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" |
                head -n 1
            )"

            actual_version_name="$(
              printf '%s\n' "$badging" |
                sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" |
                head -n 1
            )"

            if [[ "$actual_application_id" != "$EXPECTED_APPLICATION_ID" ]]; then
              fail \
                "ANDROID_ARTIFACT_IDENTITY_MISMATCH" \
                "APK applicationId '${actual_application_id}' does not match '${EXPECTED_APPLICATION_ID}'."
            fi

            application_id_check="pass"

            expected_version_name="$EXPECTED_SEMVER"

            case "$ANDROID_FLAVOR" in
              dev|qa)
                expected_version_name="${EXPECTED_SEMVER}-${ANDROID_FLAVOR}"
                ;;
            esac

            if [[ "$actual_version_code" != "$EXPECTED_BUILD_NUMBER" ||
                  "$actual_version_name" != "$expected_version_name" ]]; then
              fail \
                "ANDROID_ARTIFACT_VERSION_MISMATCH" \
                "APK version metadata does not match the canonical Flutter version."
            fi

            version_check="pass"

          elif [[ "$ARTIFACT_TYPE" == "aab" ]]; then
            # An AAB uses JAR signing rather than APK signing.
            if ! jarsigner \
              -verify \
              "$artifact_path" \
              >/dev/null 2>&1; then
              fail \
                "ANDROID_ARTIFACT_SIGNATURE_INVALID" \
                "Android App Bundle signature verification failed."
            fi

            certificate_info="$(
              keytool \
                -J-Duser.language=en \
                -J-Duser.country=US \
                -printcert \
                -jarfile "$artifact_path"
            )"

            artifact_cert_sha256="$(
              printf '%s\n' "$certificate_info" |
                sed -n \
                  's/^[[:space:]]*SHA256:[[:space:]]*//p' |
                head -n 1
            )"

            if [[ -z "$artifact_cert_sha256" ]]; then
              fail \
                "ANDROID_ARTIFACT_SIGNATURE_INVALID" \
                "AAB signer certificate fingerprint could not be resolved."
            fi

            if [[ \
              "$(normalize_fingerprint "$artifact_cert_sha256")" != \
              "$(normalize_fingerprint "$canonical_sha256")" \
            ]]; then
              fail \
                "ANDROID_ARTIFACT_SIGNER_MISMATCH" \
                "AAB signer does not match the canonical environment signing identity."
            fi

            signature_check="pass"
            signer_match="pass"

            # Package/version inspection for the production AAB is intentionally
            # left for the provenance checkpoint, where bundle metadata will be
            # inspected with the appropriate bundle tooling.
            application_id_check="contract"
            version_check="contract"
          fi

          # -------------------------------------------------------------------
          # Explicit ephemeral signing cleanup
          # -------------------------------------------------------------------

          cleanup_signing

          if [[ -e "$signing_dir" || -e "$key_properties_path" ]]; then
            fail \
              "ANDROID_BUILD_CLEANUP_FAILED" \
              "Temporary Android signing material remains after BUILD cleanup."
          fi

          trap - EXIT

          emit "cleanup" "pass"

          emit "artifact_type" "$ARTIFACT_TYPE"
          emit "artifact_path" "$artifact_path"
          emit "artifact_size" "$artifact_size"

          emit "application_id_check" "$application_id_check"
          emit "version_check" "$version_check"
          emit "signature_check" "$signature_check"
          emit "signer_match" "$signer_match"

          emit "state" "ANDROID_ARTIFACT_GENERATED"

      # -----------------------------------------------------------------------
      # Repository postcondition
      # -----------------------------------------------------------------------

      - name: Verify repository remains unmodified
        id: repository_state
        if: steps.artifact.outputs.state == 'ANDROID_ARTIFACT_GENERATED'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "state=ANDROID_REPOSITORY_MUTATION_DETECTED" >> "$GITHUB_OUTPUT"

            echo \
              "::error title=ANDROID_REPOSITORY_MUTATION_DETECTED::Android BUILD modified the checked-out repository."

            git status --short
            exit 1
          fi

          echo "state=ANDROID_REPOSITORY_CLEAN" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Evidence
      # -----------------------------------------------------------------------

      - name: Write Android BUILD summary
        if: always()
        shell: bash
        env:
          PROFILE_STATUS: ${{ steps.validate_profile.outputs.status }}
          PROFILE_STATE: ${{ steps.validate_profile.outputs.state }}

          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}

          PROFILE_SOURCE_BRANCH: ${{ steps.validate_profile.outputs.source_branch }}
          EXPECTED_SOURCE_BRANCH: ${{ steps.validate_profile.outputs.expected_source_branch }}

          PROFILE_ANDROID_FLAVOR: ${{ steps.validate_profile.outputs.android_flavor }}
          PROFILE_OKANE_ENV: ${{ steps.validate_profile.outputs.okane_env }}
          PROFILE_APPLICATION_ID: ${{ steps.validate_profile.outputs.application_id }}
          PROFILE_ARTIFACT_TYPE: ${{ steps.validate_profile.outputs.artifact_type }}

          SOURCE_SHA: ${{ steps.resolve_sha.outputs.source_sha }}
          SOURCE_SHA_STATE: ${{ steps.resolve_sha.outputs.state }}

          VERSION_STATE: ${{ steps.version.outputs.state }}
          RESOLVED_VERSION: ${{ steps.version.outputs.flutter_version }}
          RESOLVED_SEMVER: ${{ steps.version.outputs.semver }}
          RESOLVED_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          DEPENDENCIES_STATE: ${{ steps.dependencies.outputs.state }}
          PREBUILD_REPOSITORY_STATE: ${{ steps.prebuild_repository.outputs.state }}

          ARTIFACT_STATE: ${{ steps.artifact.outputs.state }}
          ARTIFACT_TYPE: ${{ steps.artifact.outputs.artifact_type }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.artifact_path }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size }}

          SIGNING_ALIAS: ${{ steps.artifact.outputs.signing_alias }}
          SIGNING_SHA1: ${{ steps.artifact.outputs.signing_sha1 }}
          SIGNING_SHA256: ${{ steps.artifact.outputs.signing_sha256 }}

          CERTIFICATE_MATCH: ${{ steps.artifact.outputs.certificate_match }}
          PRIVATE_KEY_PROBE: ${{ steps.artifact.outputs.private_key_probe }}
          SIGNING_CLEANUP: ${{ steps.artifact.outputs.cleanup }}

          APPLICATION_ID_CHECK: ${{ steps.artifact.outputs.application_id_check }}
          VERSION_CHECK: ${{ steps.artifact.outputs.version_check }}
          SIGNATURE_CHECK: ${{ steps.artifact.outputs.signature_check }}
          SIGNER_MATCH: ${{ steps.artifact.outputs.signer_match }}

          REPOSITORY_STATE: ${{ steps.repository_state.outputs.state }}

          TRIGGER_REF: ${{ github.ref_name }}
          TRIGGER_REF_TYPE: ${{ github.ref_type }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          value_or_na() {
            if [[ -z "${1:-}" ]]; then
              printf 'N/A'
            else
              printf '%s' "$1"
            fi
          }

          pass_contract_or_na() {
            case "${1:-}" in
              pass)
                printf '✅ PASS'
                ;;
              contract)
                printf '✅ CONTRACT'
                ;;
              *)
                printf 'N/A'
                ;;
            esac
          }

          if [[ "${PROFILE_STATUS:-}" != "valid" ]]; then
            final_state="${PROFILE_STATE:-ANDROID_PROFILE_INVALID}"
            status="❌ ${final_state}"

          elif [[ "${SOURCE_SHA_STATE:-}" != "ANDROID_SOURCE_SHA_RESOLVED" ]]; then
            final_state="${SOURCE_SHA_STATE:-ANDROID_SOURCE_RESOLUTION_FAILED}"
            status="❌ ${final_state}"

          elif [[ "${VERSION_STATE:-}" != "ANDROID_VERSION_RESOLVED" ]]; then
            final_state="${VERSION_STATE:-ANDROID_VERSION_STATE_INVALID}"
            status="❌ ${final_state}"

          elif [[ "${DEPENDENCIES_STATE:-}" != "ANDROID_DEPENDENCIES_RESOLVED" ]]; then
            final_state="${DEPENDENCIES_STATE:-ANDROID_DEPENDENCY_RESOLUTION_FAILED}"
            status="❌ ${final_state}"

          elif [[ "${PREBUILD_REPOSITORY_STATE:-}" != "ANDROID_REPOSITORY_CLEAN" ]]; then
            final_state="${PREBUILD_REPOSITORY_STATE:-ANDROID_REPOSITORY_STATE_UNKNOWN}"
            status="❌ ${final_state}"

          elif [[ "${ARTIFACT_STATE:-}" != "ANDROID_ARTIFACT_GENERATED" ]]; then
            final_state="${ARTIFACT_STATE:-ANDROID_ARTIFACT_GENERATION_FAILED}"
            status="❌ ${final_state}"

          elif [[ "${REPOSITORY_STATE:-}" != "ANDROID_REPOSITORY_CLEAN" ]]; then
            final_state="${REPOSITORY_STATE:-ANDROID_REPOSITORY_STATE_UNKNOWN}"
            status="❌ ${final_state}"

          else
            final_state="ANDROID_ARTIFACT_GENERATED"
            status="✅ ${final_state}"
          fi

          {
            echo "## Android BUILD"
            echo ""
            echo "**Status:** ${status}"
            echo ""

            echo "### Authorization"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`$(value_or_na "${REQUESTED_ENVIRONMENT:-}")\` |"
            echo "| Trigger ref type | \`$(value_or_na "${TRIGGER_REF_TYPE:-}")\` |"
            echo "| Trigger ref | \`$(value_or_na "${TRIGGER_REF:-}")\` |"
            echo "| Trigger SHA | \`$(value_or_na "${TRIGGER_SHA:-}")\` |"
            echo ""

            echo "### Android profile"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Source branch | \`$(value_or_na "${PROFILE_SOURCE_BRANCH:-${EXPECTED_SOURCE_BRANCH:-}}")\` |"
            echo "| Source SHA | \`$(value_or_na "${SOURCE_SHA:-}")\` |"
            echo "| Android flavor | \`$(value_or_na "${PROFILE_ANDROID_FLAVOR:-}")\` |"
            echo "| OKANE_ENV | \`$(value_or_na "${PROFILE_OKANE_ENV:-}")\` |"
            echo "| applicationId | \`$(value_or_na "${PROFILE_APPLICATION_ID:-}")\` |"
            echo "| Artifact policy | \`$(value_or_na "${PROFILE_ARTIFACT_TYPE:-}")\` |"
            echo ""

            echo "### Version"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Flutter version | \`$(value_or_na "${RESOLVED_VERSION:-}")\` |"
            echo "| SemVer | \`$(value_or_na "${RESOLVED_SEMVER:-}")\` |"
            echo "| Build number | \`$(value_or_na "${RESOLVED_BUILD_NUMBER:-}")\` |"
            echo ""

            echo "### Signing"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Alias | \`$(value_or_na "${SIGNING_ALIAS:-}")\` |"
            echo "| SHA-1 | \`$(value_or_na "${SIGNING_SHA1:-}")\` |"
            echo "| SHA-256 | \`$(value_or_na "${SIGNING_SHA256:-}")\` |"
            echo "| Certificate identity | $(pass_contract_or_na "${CERTIFICATE_MATCH:-}") |"
            echo "| Private-key probe | $(pass_contract_or_na "${PRIVATE_KEY_PROBE:-}") |"
            echo "| Ephemeral cleanup | $(pass_contract_or_na "${SIGNING_CLEANUP:-}") |"
            echo ""

            echo "### Artifact"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Type | \`$(value_or_na "${ARTIFACT_TYPE:-}")\` |"
            echo "| Path | \`$(value_or_na "${ARTIFACT_PATH:-}")\` |"
            echo "| Size | $(value_or_na "${ARTIFACT_SIZE:-}") bytes |"
            echo "| applicationId | $(pass_contract_or_na "${APPLICATION_ID_CHECK:-}") |"
            echo "| Version metadata | $(pass_contract_or_na "${VERSION_CHECK:-}") |"
            echo "| Signature | $(pass_contract_or_na "${SIGNATURE_CHECK:-}") |"
            echo "| Canonical signer | $(pass_contract_or_na "${SIGNER_MATCH:-}") |"
            echo ""

            echo "### Execution boundary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Repository | $(value_or_na "${REPOSITORY_STATE:-}") |"
            echo "| Repository mutation | none |"
            echo "| Signing material persistence | none |"
            echo "| GitHub Artifact upload | not executed |"
            echo "| Publication | not executed |"
          } >> "$GITHUB_STEP_SUMMARY"