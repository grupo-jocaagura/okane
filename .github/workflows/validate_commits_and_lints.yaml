name: Validate commits & lints

on:
  push:
    branches-ignore:
      - develop
      - master
      - 'rev/**'

  workflow_call:

permissions:
  contents: read

concurrency:
  group: base-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Base validation
    runs-on: ubuntu-latest

    if: >
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[skip ci]')
      )

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit signatures
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          get_commit_shas_push() {
            local before
            local after

            before="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
            after="$(jq -r '.after // empty' "$GITHUB_EVENT_PATH")"

            # Caso normal: validar exactamente los commits introducidos
            # por el push.
            if [[ -n "$before" && -n "$after" && ! "$before" =~ ^0+$ ]]; then
              curl -sSf \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${OWNER}/${REPO}/compare/${before}...${after}" \
                | jq -r '.commits[].sha'

              return 0
            fi

            # Fallback para pushes donde before es cero, por ejemplo
            # creación inicial de una rama.
            local payload_commits

            payload_commits="$(
              jq -r '.commits // [] | .[].id' "$GITHUB_EVENT_PATH" \
                | sed '/^$/d'
            )"

            if [[ -n "${payload_commits//[$'\t\r\n ']/}" ]]; then
              printf '%s\n' "$payload_commits"
              return 0
            fi

            # Último fallback: al menos validar el commit final.
            if [[ -n "$after" ]]; then
              printf '%s\n' "$after"
              return 0
            fi

            return 1
          }

          get_commit_shas_pull_request() {
            local base
            local head

            base="$(
              jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH"
            )"

            head="$(
              jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH"
            )"

            if [[ -z "$base" || -z "$head" ]]; then
              return 1
            fi

            # La misma política de firmas se aplica a los commits
            # introducidos por el PR.
            curl -sSf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/compare/${base}...${head}" \
              | jq -r '.commits[].sha'
          }

          case "$GITHUB_EVENT_NAME" in
            push)
              SHAS="$(get_commit_shas_push || true)"
              ;;

            pull_request)
              SHAS="$(get_commit_shas_pull_request || true)"
              ;;

            *)
              echo "::error title=Unsupported event::Base validation does not know how to resolve commits for event '${GITHUB_EVENT_NAME}'."
              exit 1
              ;;
          esac

          SHAS="$(
            printf '%s\n' "$SHAS" \
              | sed '/^[[:space:]]*$/d' \
              | sort -u
          )"

          if [[ -z "${SHAS//[$'\t\r\n ']/}" ]]; then
            echo "::error title=No commits found::No commits were identified for signature verification."
            exit 1
          fi

          fail=false
          failed_count=0
          checked_count=0

          while IFS= read -r SHA; do
            [[ -z "$SHA" ]] && continue

            ((checked_count++)) || true

            if ! RESP="$(
              curl -sSf \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${OWNER}/${REPO}/commits/${SHA}"
            )"; then
              echo "::error title=API error::Failed to fetch commit ${SHA}"
              fail=true
              ((failed_count++)) || true
              continue
            fi

            VERIFIED="$(printf '%s' "$RESP" | jq -r '.commit.verification.verified')"
            REASON="$(printf '%s' "$RESP" | jq -r '.commit.verification.reason')"

            if [[ "$VERIFIED" != "true" ]]; then
              echo "::error title=Unsigned/Unverified commit::${SHA} verified=false (reason=${REASON})"
              fail=true
              ((failed_count++)) || true
            else
              echo "✓ ${SHA} verified"
            fi
          done <<< "$SHAS"

          echo "Checked commits: ${checked_count}"

          if [[ "$fail" == "true" ]]; then
            echo "::error title=Commit signature check failed::${failed_count} commit(s) unsigned or unverified."
            exit 1
          fi

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Discover tracked Dart and Flutter packages
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FILE="${RUNNER_TEMP}/tracked_pubspecs.txt"

          git ls-files \
            | grep -E '(^|/)pubspec\.yaml$' \
            | grep -Ev '(^|/)(build|\.dart_tool)/' \
            > "$PACKAGE_FILE" || true

          if [[ ! -s "$PACKAGE_FILE" ]]; then
            echo "::error title=No packages found::No tracked pubspec.yaml files were found."
            exit 1
          fi

          echo "Tracked packages:"

          while IFS= read -r pubspec; do
            echo "  - $(dirname "$pubspec")"
          done < "$PACKAGE_FILE"

          echo "Package count: $(wc -l < "$PACKAGE_FILE" | tr -d ' ')"

      - name: Pub get
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FILE="${RUNNER_TEMP}/tracked_pubspecs.txt"

          while IFS= read -r pubspec; do
            directory="$(dirname "$pubspec")"

            echo ""
            echo ">> flutter pub get: ${directory}"

            (
              cd "$directory"
              flutter pub get
            )
          done < "$PACKAGE_FILE"

      - name: Check dependency_overrides
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FILE="${RUNNER_TEMP}/tracked_pubspecs.txt"

          found=false

          while IFS= read -r pubspec; do
            if grep -nE '^[[:space:]]*dependency_overrides:' "$pubspec"; then
              echo "::error file=${pubspec},title=dependency_overrides detected::Tracked pubspec.yaml must not contain dependency_overrides."
              found=true
            fi
          done < "$PACKAGE_FILE"

          if [[ "$found" == "true" ]]; then
            exit 1
          fi

          echo "✓ No dependency_overrides found"

      - name: Enforce dart format
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            --output=none \
            --set-exit-if-changed \
            .

      - name: Dart analyze
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FILE="${RUNNER_TEMP}/tracked_pubspecs.txt"

          while IFS= read -r pubspec; do
            directory="$(dirname "$pubspec")"

            echo ""
            echo ">> dart analyze: ${directory}"

            (
              cd "$directory"

              dart analyze \
                --fatal-infos \
                --fatal-warnings \
                .
            )
          done < "$PACKAGE_FILE"